name = "minova-titanv"
compatibility_date = "2026-08-22"
pages_build_output_dir = "."

# Cloudflare Pages 项目配置（Pages Functions 随静态站一起部署）。
# 后端在 functions/api/lead.js，路由自动映射为 /api/lead，无需独立 Worker。
#
# 本地调试：  npx wrangler pages dev .
# 部署：      npx wrangler pages deploy . --project-name=minova-titanv
#
# 注意（CF Pages 校验规则）：
#   - name 字段必须保留（Pages 顶层校验要求，缺了会 build 失败）
#   - 绝不能写 main = "xxx.js"（那是 Worker 标志，写了会被当 Worker 项目）
